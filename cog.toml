# Cocogitto configuration for ops
# Handles version bumping, changelog generation, and git tagging

from_latest_tag = true
ignore_merge_commits = true
skip_untracked = true

tag_prefix = "v"

# To avoid infinite loops
skip_ci = "[skip ci]"

pre_bump_hooks = [
  # uses cargo-edit's set-version command to set the version in Cargo.toml in the pre_bump_hooks
  # its installed with cargo-edit with taiki-e/install-action
  "cargo set-version {{version}}",
]

# No post_bump_hooks on purpose: cog only commits and tags locally.
#
# Publishing is done by the Bump workflow (a wrapper around forge's shared one),
# which replays cog's local commit through the GraphQL createCommitOnBranch
# mutation so the commit and tag land Verified and attributed to the my-cloud-ci
# App bot. A `git push` here would put an unsigned copy on main first — and worse,
# leave the branch ahead of the mutation's expectedHeadOid, so the signed push
# would fail with a confusing conflict. forge's workflow rejects a cog.toml with
# push hooks for exactly this reason. See docs/releasing.md.
#
# Bumping by hand? Push cog's local commit and tag yourself afterwards.
post_bump_hooks = []

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "ops"
owner = "rsvalerio"
authors = [
  { signature = "Rodrigo Valeri", username = "rsvalerio" },
]

[commit_types]
feat = { changelog_title = "🚀 Features", omit_from_changelog = false }
fix = { changelog_title = "🐛 Bug Fixes", omit_from_changelog = false }
doc = { changelog_title = "📚 Documentation", omit_from_changelog = false }
docs = { changelog_title = "📚 Documentation", omit_from_changelog = false }
perf = { changelog_title = "⚡ Performance", omit_from_changelog = false }
refactor = { changelog_title = "🚜 Refactoring", omit_from_changelog = false }
style = { changelog_title = "🎨 Styling", omit_from_changelog = false }
test = { changelog_title = "🧪 Testing", omit_from_changelog = false }
build = { changelog_title = "🔧 Build System", omit_from_changelog = false }
ci = { changelog_title = "🔄 CI/CD", omit_from_changelog = false }
chore = { changelog_title = "⚙️ Miscellaneous", omit_from_changelog = false }
