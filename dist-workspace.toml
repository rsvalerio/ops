[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Use .tar.gz instead of .tar.xz for broader compatibility
unix-archive = ".tar.gz"
# Build with all features so the released binary includes stack-rust (deps, about, etc.)
all-features = true
# Whether to install an updater program
install-updater = false
# Homebrew tap for formula publishing
tap = "rsvalerio/homebrew-tap"
# Publish homebrew formula to tap via the user-owned custom publish job
# (.github/workflows/publish-homebrew.yml), which mints a GitHub App token
# instead of using a static HOMEBREW_TAP_TOKEN PAT. Being a custom job, it
# survives `dist generate` regeneration.
publish-jobs = ["./publish-homebrew"]
# Custom formula name for Homebrew (install with `brew install ops`)
formula = "ops"
# Hand-maintained edits to .github/workflows/release.yml are intentional.
#
# `dist plan` does not merely regenerate the CI file — it asserts the on-disk
# contents byte-match what it would generate, and hard-fails the release
# workflow otherwise ("release.yml has out of date contents"). That check is
# incompatible with the security hardening applied to that file: third-party
# actions pinned to commit SHAs (SEC-35/TASK-1661) and an explicit `secrets:`
# block on the homebrew publish job in place of `secrets: inherit`
# (SEC-36/TASK-1662). dist emits bare tags and blanket secret forwarding, so the
# two can never agree.
#
# `allow-dirty = ["ci"]` tells dist to neither check nor regenerate release.yml,
# which makes that file ours to maintain. Consequences:
#   - Upgrading `cargo-dist-version` no longer updates release.yml on its own.
#     To take a new dist's CI changes, temporarily drop this key, run
#     `dist init`, then re-apply the SHA pins and the `secrets:` block and put
#     the key back. The `workflow-guard` job in ci.yml fails the build if either
#     is missing, so a forgotten re-apply cannot land silently.
allow-dirty = ["ci"]

# Trigger releases by workflow_dispatch rather than by tag push.
#
# The Bump workflow marks its commit `[skip ci]` so the bump does not re-trigger the
# CI + Bump cycle. GitHub applies that marker per *push event*, and a tag push is a
# push — so the release tag inherited the skip and `release.yml` never ran. The two
# behaviours shared one mechanism and could not both win.
#
# Dispatching decouples them: the marker keeps suppressing CI, and the bump job asks
# for the release explicitly once the tag exists. See docs/releasing.md.
dispatch-releases = true
