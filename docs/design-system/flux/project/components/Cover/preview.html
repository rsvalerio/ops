<!-- @dsCard height=288 -->
<!doctype html>
<html><head><style>
  html, body { margin: 0; background: var(--term-bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--term-bg); }
  .cover svg { position: absolute; inset: 0; }
  .cyan { fill: var(--ansi-cyan); }
  .magenta { fill: var(--ansi-magenta); }
  .yellow { fill: var(--ansi-yellow); }
  .green { fill: var(--ansi-green); }
  .ink { fill: var(--term-fg); }
  .cut { fill: var(--term-bg); }
  .text { position: absolute; left: 40px; bottom: 32px; max-width: 440px; font-family: var(--font-mono); }
  .name { margin: 0; font-size: 96px; line-height: .95; font-weight: 700; color: var(--term-fg); letter-spacing: -0.02em; }
  .tag { margin: 16px 0 0; font-size: 14px; line-height: 20px; color: var(--term-dim); }
</style></head><body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: ansi-cyan 280x168, ansi-magenta 160x96, ansi-yellow 100x52, ansi-green 180x100, term-fg 260x100 (radius-none: square)
      arrangement: a staggered stack, cyan and magenta bleeding off the top, green and ink off the bottom and right
      pattern: chevrons, "loud, bold": the ▸ step indent, twelve of them cut out of the cyan block in term-bg
      steps: 20px gaps between blocks, chevrons 16x20 on a 40px pitch; radius-none
    -->
    <rect class="cyan" x="500" y="0" width="280" height="168"/>
    <rect class="magenta" x="800" y="0" width="160" height="96"/>
    <rect class="yellow" x="800" y="116" width="100" height="52"/>
    <rect class="green" x="500" y="188" width="180" height="100"/>
    <rect class="ink" x="700" y="188" width="260" height="100"/>
    <g class="cut">
      <path d="M528 44 l16 10 l-16 10 z M568 44 l16 10 l-16 10 z M608 44 l16 10 l-16 10 z M648 44 l16 10 l-16 10 z M688 44 l16 10 l-16 10 z M728 44 l16 10 l-16 10 z"/>
      <path d="M528 104 l16 10 l-16 10 z M568 104 l16 10 l-16 10 z M608 104 l16 10 l-16 10 z M648 104 l16 10 l-16 10 z M688 104 l16 10 l-16 10 z M728 104 l16 10 l-16 10 z"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">ops<br>flux</h1>
    <p class="tag">Emoji status, heavy flow line, full color palette.</p>
  </div>
</div>
</body></html>
