<!doctype html>
<html><head><style>
  html, body { margin: 0; background: var(--term-bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--term-bg); }
  .cover svg { position: absolute; inset: 0; }
  .ink { fill: var(--term-fg); }
  .cyan { fill: var(--ansi-cyan); }
  .green { fill: var(--ansi-green); }
  .red { fill: var(--ansi-red); }
  .dim { fill: var(--term-dim); }
  .cut { fill: var(--term-bg); }
  .text { position: absolute; left: 40px; bottom: 32px; max-width: 440px; font-family: var(--font-mono); }
  .name { margin: 0; font-size: 96px; line-height: .95; font-weight: 700; color: var(--term-fg); letter-spacing: -0.02em; }
  .tag { margin: 16px 0 0; font-size: 14px; line-height: 20px; color: var(--term-dim); }
</style></head><body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: term-fg slab 144x240, ansi-cyan 292x124, ansi-green 168x144, ansi-red 64x40, term-dim 104x84 (radius-none: square)
      arrangement: one tall ink slab with satellites, cyan and dim bleeding off the top, right and bottom edges
      pattern: dot grid, "precise, technical, mono": the separator_char "." dot leader, cut out of the slab in term-bg
      steps: 20px gaps and dot pitch, 40px between dot lines; radius-none on every block
    -->
    <rect class="ink" x="504" y="24" width="144" height="240"/>
    <circle class="cut" cx="516" cy="44" r="2"/><circle class="cut" cx="536" cy="44" r="2"/><circle class="cut" cx="556" cy="44" r="2"/><circle class="cut" cx="576" cy="44" r="2"/><circle class="cut" cx="596" cy="44" r="2"/><circle class="cut" cx="616" cy="44" r="2"/><circle class="cut" cx="636" cy="44" r="2"/><circle class="cut" cx="516" cy="84" r="2"/><circle class="cut" cx="536" cy="84" r="2"/><circle class="cut" cx="556" cy="84" r="2"/><circle class="cut" cx="576" cy="84" r="2"/><circle class="cut" cx="596" cy="84" r="2"/><circle class="cut" cx="616" cy="84" r="2"/><circle class="cut" cx="636" cy="84" r="2"/><circle class="cut" cx="516" cy="124" r="2"/><circle class="cut" cx="536" cy="124" r="2"/><circle class="cut" cx="556" cy="124" r="2"/><circle class="cut" cx="576" cy="124" r="2"/><circle class="cut" cx="596" cy="124" r="2"/><circle class="cut" cx="616" cy="124" r="2"/><circle class="cut" cx="636" cy="124" r="2"/><circle class="cut" cx="516" cy="164" r="2"/><circle class="cut" cx="536" cy="164" r="2"/><circle class="cut" cx="556" cy="164" r="2"/><circle class="cut" cx="576" cy="164" r="2"/><circle class="cut" cx="596" cy="164" r="2"/><circle class="cut" cx="616" cy="164" r="2"/><circle class="cut" cx="636" cy="164" r="2"/><circle class="cut" cx="516" cy="204" r="2"/><circle class="cut" cx="536" cy="204" r="2"/><circle class="cut" cx="556" cy="204" r="2"/><circle class="cut" cx="576" cy="204" r="2"/><circle class="cut" cx="596" cy="204" r="2"/><circle class="cut" cx="616" cy="204" r="2"/><circle class="cut" cx="636" cy="204" r="2"/><circle class="cut" cx="516" cy="244" r="2"/><circle class="cut" cx="536" cy="244" r="2"/><circle class="cut" cx="556" cy="244" r="2"/><circle class="cut" cx="576" cy="244" r="2"/><circle class="cut" cx="596" cy="244" r="2"/><circle class="cut" cx="616" cy="244" r="2"/><circle class="cut" cx="636" cy="244" r="2"/>
    <rect class="cyan" x="668" y="0" width="292" height="124"/>
    <rect class="green" x="668" y="144" width="168" height="144"/>
    <rect class="red" x="856" y="144" width="64" height="40"/>
    <rect class="dim" x="856" y="204" width="104" height="84"/>
  </svg>
  <div class="text">
    <h1 class="name">ops<br>compact</h1>
    <p class="tag">Minimal with dot separators.</p>
  </div>
</div>
</body></html>
