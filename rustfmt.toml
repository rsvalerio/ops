# Rust foundation rustfmt configuration, written by `ops init --rust`.
#
# `ops init --rust --check` compares this file with the copy built into the
# running ops: every key below must keep its value, and keys you add are yours.
# Record a deliberate divergence under `[foundation.waivers]` in `.ops.toml`.
#
# `edition` is deliberately absent. `cargo fmt` passes the edition from each
# crate's Cargo.toml, and hardcoding it here would silently format a
# 2024-edition crate under 2021 rules.

max_width = 100
use_small_heuristics = "Max"
newline_style = "Auto"
hard_tabs = false
tab_spaces = 4

# Everything below requires nightly rustfmt. CI runs stable, so they are listed
# rather than enabled: on stable, rustfmt warns and ignores them, which reads as
# "configured" while doing nothing.
#
# imports_granularity = "Crate"
# group_imports = "StdExternalCrate"
# wrap_comments = true
# comment_width = 100
# format_code_in_doc_comments = true
