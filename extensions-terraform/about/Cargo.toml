[package]
name = "ops-about-terraform"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
ops-about = { workspace = true }
# `linkme` is never named in the source, but it is a real dependency:
# `ops_extension::impl_extension!` expands to
# `#[linkme::distributed_slice(...)]`.
linkme = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# HCL identifiers are UAX #31, and heredoc terminators are identifiers, so
# matching one needs the ID_Start / ID_Continue tables (combining marks
# included).
unicode-ident = { workspace = true }

[dev-dependencies]
# The shared `write_file` fixture helper lives behind `ops-about`'s
# `test-support` feature; the `capture_warn` tracing harness comes from
# `ops_core::test_utils`.
ops-core = { workspace = true, features = ["test-support"] }
ops-about = { workspace = true, features = ["test-support"] }
ops-extension = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
