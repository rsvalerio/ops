# The tools ops's gates and CI run, at the versions CI and developers share: forge's
# rust-ci and this repo's own CI jobs install exactly this file with jdx/mise-action, and
# `mise install` gives a laptop the same. Kept at forge's pins (forge docs/foundation.md,
# "Pipeline tools"); ops must stay >= 0.77.0, the first check-only `verify`.
[tool_alias]
ops = "github:rsvalerio/ops"
cargo-nextest = "github:nextest-rs/nextest"
cargo-machete = "github:bnjbvr/cargo-machete"
cargo-edit = "cargo:cargo-edit"

[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }
ops = "0.77.0"
cargo-nextest = { version = "0.9.146", version_prefix = "cargo-nextest-" }
cargo-deny = "0.20.2"
cargo-machete = "0.9.2"
cargo-edit = "0.13.13"
trivy = "0.70.0"
