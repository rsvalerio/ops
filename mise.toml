# The tools ops's gates and CI run, at the versions CI and developers share: forge's
# rust-ci and this repo's own CI jobs install exactly this file with jdx/mise-action, and
# `mise install` gives a laptop the same. Kept at forge's pins (forge docs/foundation.md,
# "Pipeline tools"), except ops, which tracks the newest published release here; the floor
# is 0.77.0, the first check-only `verify`. These are the Rust foundation template's pins,
# and `ops init --rust --check` holds them to it.
[tool_alias]
ops = "github:rsvalerio/ops"
cargo-nextest = "github:nextest-rs/nextest"
cargo-machete = "github:bnjbvr/cargo-machete"
cargo-edit = "cargo:cargo-edit"

[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
ops = "0.94.7"
cargo-nextest = { version = "0.9.152", version_prefix = "cargo-nextest-" }
cargo-deny = "0.22.0"
cargo-machete = "0.10.1"
cargo-edit = "0.13.14"
trivy = "0.76.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.2"
