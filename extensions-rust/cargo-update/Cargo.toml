[package]
name = "ops-cargo-update"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
# Owns the workspace's shared ANSI grammar; the parser consumes it via
# `ops_theme::strip_ansi_preserving_raw`.
ops-theme = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Provides the control-character assertions via `ops_about::test_support`;
# the tracing-capture harness comes from `ops_core::test_utils`.
ops-core = { workspace = true, features = ["test-support"] }
ops-about = { workspace = true, features = ["test-support"] }
# Drives the byte-oriented scanner property tests over generated action
# lines.
proptest = { workspace = true }

[lints]
workspace = true
