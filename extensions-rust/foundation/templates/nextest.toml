# Rust foundation nextest configuration, written by `ops init --rust`.
#
# `ops init --rust --check` compares this file with the copy built into the
# running ops: every key below must keep its value, and keys you add are yours.
# Record a deliberate divergence under `[foundation.waivers]` in `.ops.toml`.

[profile.default]
# nextest flags a test as LEAK when its output pipes have not reached EOF this
# long after the test reports a result. Raised from the 100ms default because
# under contention an exit that loses the race for a core is flagged as a leak.
# A real leak still reports LEAK, only later; a run with no leak pays nothing,
# because the wait ends at EOF, not at the timeout.
leak-timeout = "2s"

# A profile for pipelines (`cargo nextest run --profile ci`); local runs keep
# the default profile.
[profile.ci.junit]
# Relative to target/nextest/<profile>/, so this is target/nextest/ci/junit.xml.
path = "junit.xml"
# Passed tests' captured output goes into the report, never the console, so a
# CI step can surface lines such as skipped-precondition notes from green runs.
store-success-output = true
