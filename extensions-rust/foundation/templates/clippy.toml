# Rust foundation clippy configuration, written by `ops init --rust`.
#
# `ops init --rust --check` compares this file with the copy built into the
# running ops: every key below must keep its value, and keys you add are yours.
# Record a deliberate divergence under `[foundation.waivers]` in `.ops.toml`.
#
# Non-dotted spelling on purpose: clippy reads only one of `clippy.toml` and
# `.clippy.toml`, so keeping both is how two copies silently disagree.

# 25 is the baseline a repo can adopt without a refactor first. Tighten it
# locally (with a waiver) rather than loosening it here.
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 5
type-complexity-threshold = 250

# Builder and extension patterns legitimately take many lines; this only fires
# as a lint when the pedantic `too_many_lines` lint is enabled.
too-many-lines-threshold = 100

# Short binding names that are clearer than any expansion in loops, closures
# and channels.
allowed-idents-below-min-chars = ["x", "y", "i", "j", "k", "n", "id", "tx", "rx", "db", "ok"]

# Renaming a public item is a breaking change, so clippy should not propose one.
avoid-breaking-exported-api = true

# Panic-adjacent lints are denied in production code but fine in tests. These
# four keys cover exactly `unwrap_used`, `expect_used`, `panic` and
# `indexing_slicing`; clippy has no equivalent key for any other lint.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
