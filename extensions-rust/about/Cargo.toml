[package]
name = "ops-about-rust"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, which machete cannot see through.
ignored = ["linkme"]

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true, features = ["sqlite"] }
ops-about = { workspace = true, features = ["sqlite"] }
linkme = { workspace = true }
ops-sqlite = { workspace = true }
ops-cargo-toml = { workspace = true }
ops-cargo-update = { workspace = true }
ops-git = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ops-core = { workspace = true, features = ["test-support"] }
ops-extension = { workspace = true, features = ["test-support"] }
ops-about = { workspace = true, features = ["sqlite", "test-support"] }
linkme = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
