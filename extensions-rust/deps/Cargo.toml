[package]
name = "ops-deps"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, which machete cannot see through.
ignored = ["linkme"]

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
ops-theme = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ops-core = { workspace = true, features = ["test-support"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
