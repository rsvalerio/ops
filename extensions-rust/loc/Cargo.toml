[package]
name = "ops-rust-loc"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, which machete cannot see through.
ignored = ["linkme"]

[dependencies]
ops-extension = { workspace = true, features = ["sqlite"] }
ops-core = { workspace = true }
linkme = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }

ops-sqlite = { workspace = true }
[dev-dependencies]
ops-extension = { workspace = true, features = ["test-support"] }
ops-sqlite = { workspace = true, features = ["test-helpers"] }
linkme = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
