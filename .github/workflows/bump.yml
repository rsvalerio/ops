name: Bump

# Thin wrapper: everything below the trigger lives in rsvalerio/forge. See
# https://github.com/rsvalerio/forge/blob/v1/docs/consuming.md#bump
#
# The previous inline copy shelled out to `.github/scripts/api-commit.sh`, which was
# never committed to this repo — the step referencing it merged in #9 but the script
# itself only ever existed on a workstation, so every bump since has failed with
# exit 127. That script now lives in forge as `actions/signed-commit`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    # Forks inherit the workflow but not the App credentials, so gate on the owner.
    if: ${{ github.repository_owner == 'rsvalerio' && github.event.workflow_run.conclusion == 'success' }}
    uses: rsvalerio/forge/.github/workflows/bump.yml@v1
    with:
      branch: ${{ github.event.workflow_run.head_branch }}
      # The bump commit carries `[skip ci]`, and GitHub applies that marker per push
      # event — a tag push included — so the version tag could never trigger the
      # release. dist now runs in `dispatch-releases` mode and forge asks for the
      # release explicitly once the tag exists. See docs/releasing.md.
      release-workflow: release.yml
      # forge falls back to `vars.GH_APP_CLIENT_ID` itself, but pass it explicitly:
      # a variable that fails to resolve in the called workflow surfaces as an
      # opaque token-minting error rather than a missing-input one.
      app-client-id: ${{ vars.GH_APP_CLIENT_ID }}
    # Explicit rather than `secrets: inherit` — this workflow needs exactly one secret.
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
