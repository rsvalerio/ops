name: Bump
permissions:
  contents: write
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    name: Bump
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'rsvalerio' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Own-repo token from the my-cloud-ci GitHub App. Unlike GITHUB_TOKEN, pushes made with
      # it trigger the downstream release workflow on the bumped tag.
      - name: Mint workflow token (my-cloud-ci GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: rsvalerio
          # SEC-18 / TASK-1654: least privilege — without `repositories:` the
          # token is scoped to every repo in the app installation. The bump
          # job only ever pushes to this repository.
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install cargo-edit and cocogitto
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,cocogitto

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # cog bump --auto: determines version from conventional commits, then runs:
      #   pre_bump_hooks:  cargo set-version (updates Cargo.toml)
      #   post_bump_hooks: git push + git push origin <tag>
      # See cog.toml for hook definitions.
      #
      - name: Run cog bump --auto
        run: cog -vvv bump --auto
