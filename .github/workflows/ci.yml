name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-34 (TASK-1660): least privilege for the run-scoped GITHUB_TOKEN.
# Without this block the token inherits the repository default, which is
# read/write on contents, packages, pull-requests and more unless the org has
# restricted it — far more than any job here needs, on a workflow that runs
# against every PR including from forks. Every job only reads: `checkout`,
# the toolchain/sccache/install actions fetching release assets, and
# `cargo deny check`. Nothing writes, so `contents: read` is sufficient.
# Declaring it at the top level makes it the ceiling for every job; a job that
# later needs more must opt in explicitly and visibly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo fmt --all
        run: cargo fmt --all

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo check --all --all-features
        run: cargo check --all --all-features

  # VER (TASK-1669): build on the *declared* floor, not on latest stable.
  #
  # Every other job installs the default toolchain, so for a long time
  # `rust-version` was whatever the last person typed — it said 1.80 while the
  # tree needed 1.82 and the dependency graph needed 1.88, and nothing noticed
  # because CI never built on 1.80. `clippy::incompatible_msrv` (configured via
  # `msrv` in clippy.toml) catches *library* calls above the floor, but it is
  # blind to language features: the `unsafe extern "C"` blocks that forced 1.82
  # would not have tripped it. Actually compiling on the floor is the only
  # check that covers both.
  #
  # The version is read from Cargo.toml rather than written here on purpose.
  # Hardcoding it would create a second place to drift, which is the bug this
  # job exists to prevent.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Resolve the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          declared=$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -1)
          configured=$(sed -nE 's/^msrv[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' clippy.toml | head -1)
          if [ -z "$declared" ]; then
            echo "::error file=Cargo.toml::no [workspace.package] rust-version found"
            exit 1
          fi
          # These two must agree or the lint and the build disagree about the
          # floor, and each would let through what the other rejects.
          if [ "$declared" != "$configured" ]; then
            echo "::error::MSRV mismatch — Cargo.toml rust-version is '$declared' but clippy.toml msrv is '${configured:-unset}'"
            exit 1
          fi
          echo "Building against the declared MSRV $declared."
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # --all-targets so test and bench code is type-checked too: test_utils.rs
      # is where the 1.82 `unsafe extern "C"` blocks actually live.
      - name: cargo check --all --all-features --all-targets
        run: cargo check --all --all-features --all-targets

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo clippy --all --all-features -- -D warnings
        run: cargo clippy --all --all-features -- -D warnings
      # ARCH-11 / TASK-2053: the step above never compiles a single
      # `#[cfg(not(feature = ...))]` arm, so a lint that fires only in the
      # feature-off build is invisible to it. TASK-2027 is the worked example:
      # two `clippy::missing_const_for_fn` errors sat on the `duckdb`-off
      # `enrich_from_db` stubs in ops-about and only surfaced when someone ran
      # `cargo clippy -p ops-about`. `-D clippy::nursery` is workspace policy,
      # so such a regression lands on whoever next lints a subset of crates.
      # The default-feature sweep is the other half of the matrix; locally it
      # is `ops clippy-default`, wired into `run-before-push`.
      - name: cargo clippy --workspace --all-targets -- -D warnings (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # Path A (docs/duckdb-prebuilt-lib.md, Phase 2): link the prebuilt
      # libduckdb instead of compiling the amalgamation. Only jobs that LINK
      # a binary need this — check/clippy/msrv never link and pass without
      # the lib via build.rs's bare `-lduckdb` fallback.
      - name: Fetch prebuilt libduckdb
        run: |
          set -euo pipefail
          eval "$(scripts/fetch-duckdb.sh)"
          echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
      - name: cargo build --all --all-features
        run: cargo build --all --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_VERBOSE: true
      OPS_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # Path A (docs/duckdb-prebuilt-lib.md, Phase 2) — see the note in the
      # Build job for why only linking jobs fetch the prebuilt lib.
      - name: Fetch prebuilt libduckdb
        run: |
          set -euo pipefail
          eval "$(scripts/fetch-duckdb.sh)"
          echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest
      # `-- --ignored` runs *only* ignored tests, so this job was executing 22
      # of the workspace's ~2500 and filtering out the rest — the Test check
      # passed on roughly 1% of the suite. `--run-ignored all` (nextest's
      # --include-ignored) runs both. Doctests stay on cargo test: nextest
      # does not run them.
      - name: cargo nextest run --all --all-features --run-ignored all
        run: cargo nextest run --all --all-features --run-ignored all
      - name: cargo test --all --all-features --doc
        run: cargo test --all --all-features --doc

  deps:
    name: Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Install cargo-edit and cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-edit,cargo-deny
      # SEC-37 (TASK-1663): the `Install ops` step that used to sit here was
      # removed. It pulled the *latest* published `ops` release (unpinned) on
      # every PR run, but nothing consumed it — the step below shells out to
      # `cargo deny` directly. It was pure supply-chain surface for no benefit,
      # and installing the last release to check the PR that changes it is
      # backwards regardless.
      - name: cargo deny check
        run: cargo deny check

  # SEC-35 (TASK-1661): third-party actions must be pinned to a full commit SHA.
  #
  # A tag like `@v6` is repointable by the upstream maintainer, or by anyone who
  # compromises their repo, with no visible change here. That matters most for
  # `publish-homebrew.yml`, where `create-github-app-token` receives
  # GH_APP_PRIVATE_KEY and mints a token that can push to homebrew-tap.
  #
  # This guard exists because `release.yml` is dist-generated territory: dist
  # emits bare tags and would undo the pins. That file is now hand-maintained
  # via `allow-dirty = ["ci"]` in dist-workspace.toml, so a regeneration is a
  # deliberate act — this guard is what stops one landing with the hardening
  # dropped on the floor.
  workflow-guard:
    name: Workflow Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Every third-party `uses:` is pinned to a 40-hex commit SHA
        run: |
          set -euo pipefail
          # Exempt: local workflow calls (./...), and the first-party forge
          # reusable workflow, which is version-pinned by deliberate decision
          # (see the comment in bump.yml). Everything else must be a SHA.
          if offenders=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows/ \
                | grep -vE 'uses:\s*\./' \
                | grep -vE 'uses:\s*rsvalerio/forge/' \
                | grep -vE 'uses:\s*[^@]+@[0-9a-f]{40}(\s|$)' \
                | grep .); then
            echo "::error::unpinned action reference(s) found — pin to a full commit SHA with a trailing '# vX.Y.Z' comment"
            echo "$offenders"
            echo
            echo "If release.yml was just regenerated by 'dist generate', re-apply the pins."
            exit 1
          fi
          echo "All third-party action references are SHA-pinned."

      # SEC-36 (TASK-1662): `secrets: inherit` forwards every repo secret to the
      # called workflow. dist emits it into release.yml, so like the pins above
      # it needs a guard to survive a deliberate regeneration.
      - name: "No workflow forwards all secrets with `secrets: inherit`"
        run: |
          set -euo pipefail
          if offenders=$(grep -rnE '^\s*secrets:\s*inherit\s*$' .github/workflows/ | grep .); then
            echo "::error::\`secrets: inherit\` forwards every repo secret — pass only the secrets the called workflow declares"
            echo "$offenders"
            echo
            echo "If release.yml was just regenerated by 'dist generate', re-apply the explicit secrets block."
            exit 1
          fi
          echo "No workflow uses \`secrets: inherit\`."
