name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-34 (TASK-1660): least privilege for the run-scoped GITHUB_TOKEN.
# Without this block the token inherits the repository default, which is
# read/write on contents, packages, pull-requests and more unless the org has
# restricted it — far more than any job here needs, on a workflow that runs
# against every PR including from forks. Every job only reads: `checkout`,
# the toolchain/mise/cache actions fetching release assets, and
# `cargo deny check`. Nothing writes, so `contents: read` is sufficient.
# Declaring it at the top level makes it the ceiling for every job; a job that
# later needs more must opt in explicitly and visibly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # forge's rust-ci sets OPS__CARGO__LOCKED=true in its own jobs; it is
  # deliberately absent here, because the `test` job runs ops's own config
  # tests, which would see it and expect `--locked` in every cargo command they
  # resolve.

jobs:
  # TASK-2329: the shared gates come from forge's rust-ci, run through ops, the
  # same way every other Rust repo runs them, so the tool that defines the gates
  # proves them in CI. It runs exactly the two gates a developer runs, one job
  # each: `ops verify` (fmt-check, the whitespace and end-of-file checks,
  # clippy, build, check-json, check-yaml, doc — all check-only, TASK-2322) and
  # `ops qa` as this repo's .ops.toml defines it (deps, nextest, doctests, sec,
  # the TEST-26 skip report, the `#[ignore]` tests and the default-feature
  # clippy: the same gate run-before-push runs). With `run-msrv` it adds
  # `ops msrv --install` (TASK-1669 / TASK-2327: build on the declared
  # rust-version floor, not on latest stable). The `main-protection` ruleset
  # requires `rust-ci / verify` and `rust-ci / qa`.
  #
  # The gates run through the ops release this repo's mise.toml pins, installed
  # by rust-ci with jdx/mise-action, not through this checkout's build: CI
  # proves the gates as a consumer sees them, and this checkout's own behaviour
  # is covered by the test suite `ops qa` runs.
  #
  # forge is referenced by its moving major tag like bump.yml does; the
  # `[lint_actions]` allow-list in .ops.toml exempts it from SHA pinning.
  rust-ci:
    name: rust-ci
    uses: rsvalerio/forge/.github/workflows/rust-ci.yml@feat/rust-ci-verify-qa # TEMP: back to @v1 once forge v0.7.0 moves v1, before merging
    with:
      run-msrv: true

  # TASK-2294: `Store::lock_allocation` has a `#[cfg(not(unix))]` branch (a
  # persistent `.allocation.lock` file instead of a lock on the `tasks/`
  # directory fd) that no Linux job ever compiles. Release targets are all
  # Unix today (dist-workspace.toml), but the branch exists, so it must at
  # least build — and its one behavioural promise, that concurrent keyed
  # creates file exactly one task, must hold where it runs. Scoped to
  # ops-backlog: its only dependencies are portable (anyhow, serde_json,
  # chrono), whereas the rest of the workspace is Unix-only by design.
  windows-backlog:
    name: Windows (ops-backlog)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - name: cargo check -p ops-backlog --all-targets
        run: cargo check -p ops-backlog --all-targets
      - name: cargo test -p ops-backlog concurrent keyed create (non-Unix allocation lock)
        run: cargo test -p ops-backlog --lib cmd::create::tests::concurrent_keyed_creates_file_exactly_one_task -- --exact

  # UNSAFE-10 / TASK-2087 + TASK-2094: Miri over the workspace's production
  # `unsafe`, scoped to what Miri can actually execute. Miri has no shims
  # for direct foreign-function calls into libc, which rules out most of the
  # FFI unsafe by construction; the job covers the pure-memory unsafe plus
  # every guard-construction path reachable without a real OS.
  #
  # Covered:
  # - ops-core `config::edit::tests::atomic_write*` — exercises
  #   `build_tmp_basename`'s `OsStr::from_encoded_bytes_unchecked` (the
  #   `.ops.toml` tmp-name builder) and the fd-ownership transfer of the
  #   atomic write/rename dance.
  # - ops-runner `terminal::tests::disable_echo_*` — `EchoGuard`
  #   construction on the non-TTY branch (stderr is a pipe under the test
  #   harness, so the early return runs before any unsafe).
  #
  # Excluded, with the substitute evidence named here per UNSAFE-10:
  # - ops-core `text::unix_open` walk (`libc::openat` / `fstat` / `fcntl`):
  #   unshimmed foreign calls. Covered instead by the symlink/FIFO refusal
  #   test module under the ordinary Test job plus per-block SAFETY prose.
  # - ops-core `atomic_write_mode_unaffected_by_umask` (skipped below): it
  #   calls the `umask` foreign function directly, which Miri cannot
  #   execute.
  # - ops-runner termios path (`tcgetattr`/`tcsetattr`, the
  #   `MaybeUninit::assume_init`) and `process_group`'s `killpg`: unshimmed
  #   foreign calls, and the termios path additionally requires a real TTY
  #   on stderr, which Miri's emulated stderr never provides. See the
  #   UNSAFE-10 notes in crates/runner/src/terminal.rs and
  #   crates/runner/src/command/process_group.rs.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No git operations run in this job; the persist-credentials
          # default would leave the token in .git/config for every later
          # step, mirroring the miri-run tests' untrusted-input posture.
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: miri
          rustflags: ""
      - name: cargo miri test -p ops-core (atomic write / build_tmp_basename)
        run: cargo +nightly miri test -p ops-core config::edit::tests::atomic_write -- --skip atomic_write_mode_unaffected_by_umask
      - name: cargo miri test -p ops-runner (EchoGuard non-TTY construction)
        run: cargo +nightly miri test -p ops-runner disable_echo

  # SEC-35 (TASK-1661) / SEC-36 (TASK-1662): the workflow supply-chain policy.
  #
  # Third-party actions must be pinned to a full commit SHA with a `# vX.Y.Z`
  # comment. A tag like `@v6` is repointable by the upstream maintainer, or by
  # anyone who compromises their repo, with no visible change here. That
  # matters most for `publish-homebrew.yml`, where `create-github-app-token`
  # receives GH_APP_PRIVATE_KEY and mints a token that can push to
  # homebrew-tap. And no workflow may forward every repo secret with
  # `secrets: inherit`.
  #
  # This guard exists because `release.yml` is dist-generated territory: dist
  # emits bare tags and `secrets: inherit` and would undo both. That file is
  # now hand-maintained via `allow-dirty = ["ci"]` in dist-workspace.toml, so
  # a regeneration is a deliberate act — this guard is what stops one landing
  # with the hardening dropped on the floor. If it fails right after
  # `dist generate`, re-apply the pins and the explicit `secrets:` block.
  #
  # TASK-2328: the policy is the `ops lint-actions` built-in. Local `./` calls
  # and the first-party forge reusable workflows (version-pinned by deliberate
  # decision, see bump.yml) are exempt. The allow-list lives under
  # `[lint_actions]` in .ops.toml (TASK-2337), so a local `ops lint-actions`
  # applies the same exemptions as this job.
  #
  # ops comes from mise.toml through jdx/mise-action; the check compiles
  # nothing, so the job caches no target/.
  workflow-guard:
    name: Workflow Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
      - name: ops lint-actions
        run: ops lint-actions
