name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo fmt --all
        run: cargo fmt --all

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo check --all --all-features
        run: cargo check --all --all-features

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo clippy --all --all-features -- -D warnings
        run: cargo clippy --all --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo build --all --all-features
        run: cargo build --all --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_VERBOSE: true
      OPS_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo test --all --all-features -- --ignored
        run: cargo test --all --all-features -- --ignored

  deps:
    name: Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install cargo-edit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,cargo-deny
      - name: Install ops
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: rsvalerio/ops
      - name: ops --raw deps
        run: cargo deny check

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: cargo install --path crates/cli --force --all-features
        run: cargo install --path crates/cli --force --all-features

  release-workflow-guard:
    name: Release workflow guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify hand-applied token steps survived `dist generate`
        # release.yml is cargo-dist-generated, but its publish-homebrew job
        # carries a hand-applied GitHub App token-mint step (see the NOTE in
        # release.yml). Re-running `dist generate` silently drops that step
        # and reverts to the retired HOMEBREW_TAP_TOKEN secret, which would
        # only be discovered when the next tagged release fails at the
        # homebrew publish stage. Fail here, at PR time, instead.
        run: |
          if ! grep -q 'id: tap-token' .github/workflows/release.yml; then
            echo '::error file=.github/workflows/release.yml::tap-token mint step is missing — `dist generate` dropped it; re-apply the "Mint homebrew-tap token" step (see NOTE in release.yml)'
            exit 1
          fi
          # Match only an actual secret usage — the NOTE comment in release.yml
          # mentions HOMEBREW_TAP_TOKEN by name, so a bare grep self-trips.
          if grep -q 'secrets\.HOMEBREW_TAP_TOKEN' .github/workflows/release.yml; then
            echo '::error file=.github/workflows/release.yml::stale HOMEBREW_TAP_TOKEN reference — replace it with the minted tap-token step output (see NOTE in release.yml)'
            exit 1
          fi
