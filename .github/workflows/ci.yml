name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-34 (TASK-1660): least privilege for the run-scoped GITHUB_TOKEN.
# Without this block the token inherits the repository default, which is
# read/write on contents, packages, pull-requests and more unless the org has
# restricted it — far more than any job here needs, on a workflow that runs
# against every PR including from forks. Every job only reads: `checkout`,
# the toolchain/sccache/install actions fetching release assets, and
# `cargo deny check`. Nothing writes, so `contents: read` is sufficient.
# Declaring it at the top level makes it the ceiling for every job; a job that
# later needs more must opt in explicitly and visibly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # TASK-2322: `--check` fails on unformatted code; without it `cargo fmt`
      # rewrites the checkout and exits 0, so this job could never fail.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo check --all --all-features
        run: cargo check --all --all-features

  # VER (TASK-1669): build on the *declared* floor, not on latest stable.
  #
  # Every other job installs the default toolchain, so for a long time
  # `rust-version` was whatever the last person typed — it said 1.80 while the
  # tree needed 1.82 and the dependency graph needed 1.88, and nothing noticed
  # because CI never built on 1.80. `clippy::incompatible_msrv` (configured via
  # `msrv` in clippy.toml) catches *library* calls above the floor, but it is
  # blind to language features: the `unsafe extern "C"` blocks that forced 1.82
  # would not have tripped it. Actually compiling on the floor is the only
  # check that covers both.
  #
  # TASK-2327: the check is the `ops msrv` built-in rather than inline shell.
  # It reads rust-version from Cargo.toml (never a second hardcoded copy),
  # fails unless clippy.toml's msrv agrees, installs exactly that toolchain
  # (--install) and runs `cargo check --workspace --all-features
  # --all-targets` on it — --all-targets because test_utils.rs is where the
  # 1.82 `unsafe extern "C"` blocks live. ops itself builds on stable.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: ops msrv --install
        run: cargo run --locked -p ops -- msrv --install

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo clippy --all --all-features -- -D warnings
        run: cargo clippy --all --all-features -- -D warnings
      # ARCH-11 / TASK-2053: the step above never compiles a single
      # `#[cfg(not(feature = ...))]` arm, so a lint that fires only in the
      # feature-off build is invisible to it. TASK-2027 is the worked example:
      # two `clippy::missing_const_for_fn` errors sat on the feature-off
      # `enrich_from_db` stubs in ops-about and only surfaced when someone ran
      # `cargo clippy -p ops-about`. `-D clippy::nursery` is workspace policy,
      # so such a regression lands on whoever next lints a subset of crates.
      # The default-feature sweep is the other half of the matrix; locally it
      # is `ops clippy-default`, wired into `run-before-push`.
      - name: cargo clippy --workspace --all-targets -- -D warnings (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo build --all --all-features
        run: cargo build --all --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_VERBOSE: true
      OPS_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest
      # `-- --ignored` runs *only* ignored tests, so this job was executing 22
      # of the workspace's ~2500 and filtering out the rest — the Test check
      # passed on roughly 1% of the suite. `--run-ignored all` (nextest's
      # --include-ignored) runs both. Doctests stay on cargo test: nextest
      # does not run them.
      #
      # `--profile ci` (.config/nextest.toml) stores passed tests' captured
      # output in a JUnit report instead of the console. That is the sink the
      # step below reads: skip_precondition lines are captured away by both
      # runners' default output handling, so a passing-but-skipped test is
      # otherwise invisible in a green log (TEST-26 / TASK-2252).
      - name: cargo nextest run --all --all-features --run-ignored all
        run: cargo nextest run --profile ci --all --all-features --run-ignored all
      # TEST-26 / TASK-2252: surface `skip: …` lines from the JUnit report.
      # Skips are a warning, not a failure — the guards that emit them exist
      # precisely so environments lacking a capability can still run the
      # suite — but the log must never show an unexplained green where
      # assertions did not run. Only lines carrying the `skip:` marker are
      # printed, so no whole-suite success-output noise comes with them.
      - name: Surface skip_precondition lines (TEST-26)
        run: |
          set -euo pipefail
          report=target/nextest/ci/junit.xml
          # A missing report must fail the step: the `|| true` below would
          # otherwise print "No skip_precondition lines" and succeed — the
          # exact unexplained green this step exists to prevent.
          if [ ! -f "$report" ]; then
            echo "::error::JUnit report not found at $report — skip surfacing could not inspect test output (TEST-26 / TASK-2252)"
            exit 1
          fi
          count=$(grep -o 'skip: [^<]*' "$report" | wc -l || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count skip_precondition line(s) were printed by passing tests — the assertions behind them did not run"
            grep -o 'skip: [^<]*' "$report" | sort | uniq -c
          else
            echo "No skip_precondition lines: every guard that tripped also ran its assertions."
          fi
      - name: cargo test --all --all-features --doc
        run: cargo test --all --all-features --doc

  # TASK-2294: `Store::lock_allocation` has a `#[cfg(not(unix))]` branch (a
  # persistent `.allocation.lock` file instead of a lock on the `tasks/`
  # directory fd) that no Linux job ever compiles. Release targets are all
  # Unix today (dist-workspace.toml), but the branch exists, so it must at
  # least build — and its one behavioural promise, that concurrent keyed
  # creates file exactly one task, must hold where it runs. Scoped to
  # ops-backlog: its only dependencies are portable (anyhow, serde_json,
  # chrono), whereas the rest of the workspace is Unix-only by design.
  windows-backlog:
    name: Windows (ops-backlog)
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - name: cargo check -p ops-backlog --all-targets
        run: cargo check -p ops-backlog --all-targets
      - name: cargo test -p ops-backlog concurrent keyed create (non-Unix allocation lock)
        run: cargo test -p ops-backlog --lib cmd::create::tests::concurrent_keyed_creates_file_exactly_one_task -- --exact

  # UNSAFE-10 / TASK-2087 + TASK-2094: Miri over the workspace's production
  # `unsafe`, scoped to what Miri can actually execute. Miri has no shims
  # for direct foreign-function calls into libc, which rules out most of the
  # FFI unsafe by construction; the job covers the pure-memory unsafe plus
  # every guard-construction path reachable without a real OS.
  #
  # Covered:
  # - ops-core `config::edit::tests::atomic_write*` — exercises
  #   `build_tmp_basename`'s `OsStr::from_encoded_bytes_unchecked` (the
  #   `.ops.toml` tmp-name builder) and the fd-ownership transfer of the
  #   atomic write/rename dance.
  # - ops-runner `terminal::tests::disable_echo_*` — `EchoGuard`
  #   construction on the non-TTY branch (stderr is a pipe under the test
  #   harness, so the early return runs before any unsafe).
  #
  # Excluded, with the substitute evidence named here per UNSAFE-10:
  # - ops-core `text::unix_open` walk (`libc::openat` / `fstat` / `fcntl`):
  #   unshimmed foreign calls. Covered instead by the symlink/FIFO refusal
  #   test module under the ordinary Test job plus per-block SAFETY prose.
  # - ops-core `atomic_write_mode_unaffected_by_umask` (skipped below): it
  #   calls the `umask` foreign function directly, which Miri cannot
  #   execute.
  # - ops-runner termios path (`tcgetattr`/`tcsetattr`, the
  #   `MaybeUninit::assume_init`) and `process_group`'s `killpg`: unshimmed
  #   foreign calls, and the termios path additionally requires a real TTY
  #   on stderr, which Miri's emulated stderr never provides. See the
  #   UNSAFE-10 notes in crates/runner/src/terminal.rs and
  #   crates/runner/src/command/process_group.rs.
  #
  # RUSTC_WRAPPER is cleared: cargo-miri swaps in its own rustc driver, and
  # sccache in front of that combination is untested here.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No git operations run in this job; the persist-credentials
          # default would leave the token in .git/config for every later
          # step, mirroring the miri-run tests' untrusted-input posture.
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: miri
          rustflags: ""
      - name: cargo miri test -p ops-core (atomic write / build_tmp_basename)
        run: cargo +nightly miri test -p ops-core config::edit::tests::atomic_write -- --skip atomic_write_mode_unaffected_by_umask
      - name: cargo miri test -p ops-runner (EchoGuard non-TTY construction)
        run: cargo +nightly miri test -p ops-runner disable_echo

  deps:
    name: Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Install cargo-edit and cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-edit,cargo-deny
      # SEC-37 (TASK-1663): the `Install ops` step that used to sit here was
      # removed. It pulled the *latest* published `ops` release (unpinned) on
      # every PR run, but nothing consumed it — the step below shells out to
      # `cargo deny` directly. It was pure supply-chain surface for no benefit,
      # and installing the last release to check the PR that changes it is
      # backwards regardless.
      - name: cargo deny check
        run: cargo deny check

  # SEC-35 (TASK-1661) / SEC-36 (TASK-1662): the workflow supply-chain policy.
  #
  # Third-party actions must be pinned to a full commit SHA with a `# vX.Y.Z`
  # comment. A tag like `@v6` is repointable by the upstream maintainer, or by
  # anyone who compromises their repo, with no visible change here. That
  # matters most for `publish-homebrew.yml`, where `create-github-app-token`
  # receives GH_APP_PRIVATE_KEY and mints a token that can push to
  # homebrew-tap. And no workflow may forward every repo secret with
  # `secrets: inherit`.
  #
  # This guard exists because `release.yml` is dist-generated territory: dist
  # emits bare tags and `secrets: inherit` and would undo both. That file is
  # now hand-maintained via `allow-dirty = ["ci"]` in dist-workspace.toml, so
  # a regeneration is a deliberate act — this guard is what stops one landing
  # with the hardening dropped on the floor. If it fails right after
  # `dist generate`, re-apply the pins and the explicit `secrets:` block.
  #
  # TASK-2328: the policy is the `ops lint-actions` built-in. Local `./` calls
  # and the first-party forge reusable workflows (version-pinned by deliberate
  # decision, see bump.yml) are exempt. The allow-list lives under
  # `[lint_actions]` in .ops.toml (TASK-2337), so a local `ops lint-actions`
  # applies the same exemptions as this job.
  workflow-guard:
    name: Workflow Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: ops lint-actions
        run: cargo run --locked -p ops -- lint-actions
