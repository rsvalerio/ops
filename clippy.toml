cognitive-complexity-threshold = 25
too-many-arguments-threshold = 5
type-complexity-threshold = 250
too-many-lines-threshold = 100
# Product names `doc_markdown` would otherwise ask to backtick; ".." keeps
# clippy's defaults.
doc-valid-idents = ["CodeRabbit", ".."]
allowed-idents-below-min-chars = ["x", "y", "i", "j", "k", "n", "id", "tx", "rx", "db", "ok"]
avoid-breaking-exported-api = true
# Keep equal to `rust-version` in the root Cargo.toml, so
# `clippy::incompatible_msrv` fails the gate on any standard-library call newer
# than the declared floor and the declaration cannot silently drift (TASK-1669).
# Note MSRV-aware lints also gate their *suggestions* on this value: at a floor
# below 1.92 clippy suppresses `duration_suboptimal_units` because
# `Duration::from_mins` would not be available.
msrv = "1.97"

# Panic-adjacent lints are denied in production code but fine in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Spawns go through `ops_core::subprocess::spawn_locked`, so a spawn on one
# thread cannot inherit another thread's capture pipe before `FD_CLOEXEC` is
# set on targets without `pipe2`. See crates/core/src/subprocess/spawn.rs.
disallowed-methods = [
  { path = "std::process::Command::spawn", reason = "spawn under ops_core::subprocess::spawn_locked" },
  { path = "std::process::Command::output", reason = "use ops_core::subprocess::output_locked" },
  { path = "std::process::Command::status", reason = "spawn under ops_core::subprocess::spawn_locked" },
  { path = "tokio::process::Command::spawn", reason = "spawn under ops_core::subprocess::spawn_locked" },
  { path = "tokio::process::Command::output", reason = "spawn under ops_core::subprocess::spawn_locked" },
  { path = "tokio::process::Command::status", reason = "spawn under ops_core::subprocess::spawn_locked" },
]
