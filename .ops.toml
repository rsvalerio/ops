[output]
theme = "compact"
#theme = "classic"

# TASK-2328 / TASK-2337: `ops lint-actions` exemptions. The first-party forge
# reusable workflows are version-pinned by deliberate decision (see bump.yml),
# not SHA-pinned. CI's Workflow Guard job reads this same list.
[lint_actions]
allow = ["rsvalerio/forge/"]

[commands.install]
program = "cargo"
args = ["install", "--path", "crates/cli", "--force", "--all-features"]

# ARCH-11 / TASK-2053: the shared `clippy` gate lints `--all-features`, so
# every `#[cfg(not(feature = ...))]` arm in the workspace is never compiled and
# its lints are invisible. `--all-features` and default features are two
# different builds; neither subsumes the other. This is the second half — the
# default-feature sweep — so a lint that only fires with a feature OFF fails a
# gate here rather than ambushing whoever next runs `cargo clippy -p <crate>`.
# See docs/clippy.md, "Two feature sets, two blind spots".
#
# It is deliberately NOT folded into `verify`: that is the pre-commit gate, and
# a second full-workspace clippy under a different feature fingerprint means a
# second full compile every commit. It runs pre-push and in CI instead.
[commands.clippy-default]
program = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
help = "Lint the default-feature build (the --all-features gate's blind spot)"
category = "Code Quality"

# `missing_docs` opt-in for doc-complete crates. The lint is not in
# `[workspace.lints]` because most crates were never held to it, and Cargo
# rejects a member `[lints]` table that both inherits the workspace and adds
# a lint, so a crate cannot opt in from its manifest. Each crate listed here
# is instead documented by `cargo rustdoc` with `-D missing_docs` applied to
# that crate alone (dependencies are untouched), reusing the `doc` gate's
# build. To opt a crate in, add a `missing-docs-<crate>` leaf and list it in
# `missing-docs`. See docs/clippy.md, "missing_docs is opt-in per crate".
[commands.missing-docs-text-fixers]
program = "cargo"
args = ["rustdoc", "-p", "ops-text-fixers", "--lib", "--all-features", "--", "-D", "missing_docs"]
help = "Fail on undocumented public items in ops-text-fixers"
category = "Code Quality"

[commands.missing-docs-config-checkers]
program = "cargo"
args = ["rustdoc", "-p", "ops-config-checkers", "--lib", "--all-features", "--", "-D", "missing_docs"]
help = "Fail on undocumented public items in ops-config-checkers"
category = "Code Quality"

[commands.missing-docs]
commands = ["missing-docs-text-fixers", "missing-docs-config-checkers"]
parallel = true
fail_fast = true
help = "Fail on undocumented public items in the crates that opted in to missing_docs"
category = "Code Quality"

# Public-only rustdoc for crates whose private intra-doc links were cleared
# (public docs linking private items render dead links in published docs).
# The `doc` gate documents the workspace with `--document-private-items`, so
# it can never see the regression; these leaves build each crate without it,
# and `-D warnings` turns `rustdoc::private_intra_doc_links` (warn by default)
# into a failure. To cover another crate, add a `public-docs-<crate>` leaf and
# list it in `public-docs`.
[commands.public-docs-about]
program = "cargo"
args = ["rustdoc", "-p", "ops-about", "--lib", "--all-features", "--", "-D", "warnings"]
help = "Build public-only docs for ops-about; private intra-doc links fail"
category = "Code Quality"

[commands.public-docs-extension]
program = "cargo"
args = ["rustdoc", "-p", "ops-extension", "--lib", "--all-features", "--", "-D", "warnings"]
help = "Build public-only docs for ops-extension; private intra-doc links fail"
category = "Code Quality"

[commands.public-docs-rust-foundation]
program = "cargo"
args = ["rustdoc", "-p", "ops-rust-foundation", "--lib", "--all-features", "--", "-D", "warnings"]
help = "Build public-only docs for ops-rust-foundation; private intra-doc links fail"
category = "Code Quality"

[commands.public-docs]
commands = ["public-docs-about", "public-docs-extension", "public-docs-rust-foundation"]
parallel = true
fail_fast = true
help = "Build public-only docs for the crates whose private intra-doc links were cleared"
category = "Code Quality"

# The rust stack's default `verify` with `doc-ids`, `missing-docs` and
# `public-docs` appended. The `doc-ids` scan is read-only and finishes in
# milliseconds, so it overlaps the parallel checks without slowing the gate,
# and the repo that ships the check is held to it. `missing-docs` re-documents
# only the opted-in crates and `public-docs` only the cleared crates, each on
# top of the `doc` gate's build.
[commands.verify]
commands = ["fmt-check", "trailing-whitespace-check", "end-of-file-fixer-check", "clippy", "build", "check-json", "check-yaml", "doc", "doc-ids", "missing-docs", "public-docs"]
aliases = ["verify-check"]
parallel = true
fail_fast = true
help = "Run fmt-check, trailing-whitespace-check, end-of-file-fixer-check, clippy, build, check-json, check-yaml, doc, doc-ids, missing-docs, public-docs in parallel; fixes nothing in place"
category = "Code Quality"

# TASK-2343: `lint-actions` (the workflow SHA-pin / `secrets: inherit` policy,
# with the `[lint_actions]` allow-list above) compiles nothing and runs in
# milliseconds, so it runs at commit time rather than only in CI's Workflow
# Guard job.
[commands.run-before-commit]
commands = ["verify-fix","end-of-file-fixer","trailing-whitespace","lint-actions"]
fail_fast = true
help = "Run run-before-commit checks before committing"

# The full gate, identical locally and in CI: forge's rust-ci runs `ops qa` as
# its qa job, and run-before-push runs exactly `qa`. On top of the built-in qa's
# deps, tests, doctests and sec, it uses nextest (`qax`), reports skipped
# preconditions (TEST-26), runs the `#[ignore]` tests, and lints the
# default-feature build (`clippy-default`).
[commands.qa]
commands = ["qax","skip-report","next-ignored","clippy-default"]
fail_fast = true
help = "Run the full gate: deps, tests, doctests, sec, ignored tests, default-feature clippy"

# TEST-26 / TASK-2252: `skip_precondition` prints `skip: …` when a test bails on
# an unmet precondition, but nextest captures passing tests' output, so a green
# run hides it. See scripts/skip-report.sh.
[commands.skip-report]
program = "scripts/skip-report.sh"
help = "Print the skip_precondition lines of the last ops next run (TEST-26)"
category = "Testing"

[commands.run-before-push]
commands = ["qa"]
fail_fast = true
help = "Run run-before-push checks before pushing"
