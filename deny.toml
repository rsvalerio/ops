[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# RUSTSEC-2020-0163: term_size is unmaintained (INFO, not a vulnerability).
# Pulled in by tokei 14.0.0 (latest) — no fix available upstream.
# RUSTSEC-2026-0543 / -0555 / -0559: chrono, chrono-tz, chrono-tz-build are
# unmaintained (no fix; all versions affected). After ops-backlog moved to jiff
# they arrive only through tokei 14.0.0 (latest) -> tera, as a *build-time*
# dependency of tokei — no chrono code is linked into ops itself.
ignore = [
    "RUSTSEC-2020-0163",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    "RUSTSEC-2026-0559",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# r-efi uses LGPL-2.1-or-later but is only linked on UEFI targets
exceptions = [
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
