[workspace]
members = ["crates/*", "extensions/*", "extensions-rust/*", "extensions-go/*", "extensions-java/*", "extensions-node/*", "extensions-python/*", "extensions-terraform/*"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.43.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Rodrigo Valeri"]
rust-version = "1.97"
description = "Batteries-included task runner for any stack"
repository = "https://github.com/rsvalerio/ops"
homepage = "https://github.com/rsvalerio/ops"

[workspace.dependencies]
ops-core = { path = "crates/core" }
ops-extension = { path = "crates/extension" }
ops-theme = { path = "crates/theme" }
ops-runner = { path = "crates/runner" }
ops-duckdb = { path = "extensions/duckdb" }
ops-tokei = { path = "extensions/tokei" }
ops-about = { path = "extensions/about" }
ops-about-rust = { path = "extensions-rust/about" }
ops-create-review-tasks = { path = "extensions/create-review-tasks" }
ops-create-review-tasks-rust = { path = "extensions-rust/create-review-tasks" }
ops-about-go = { path = "extensions-go/about" }
ops-about-node = { path = "extensions-node/about" }
ops-about-java = { path = "extensions-java/about" }
ops-about-python = { path = "extensions-python/about" }
ops-cargo-toml = { path = "extensions-rust/cargo-toml" }
ops-cargo-update = { path = "extensions-rust/cargo-update" }
ops-deps = { path = "extensions-rust/deps" }
ops-metadata = { path = "extensions-rust/metadata" }
ops-rust-loc = { path = "extensions-rust/loc" }
ops-git = { path = "extensions/git" }
ops-tfplan = { path = "extensions-terraform/plan" }
ops-about-terraform = { path = "extensions-terraform/about" }
ops-hook-common = { path = "extensions/hook-common" }
ops-run-before-commit = { path = "extensions/run-before-commit" }
ops-run-before-push = { path = "extensions/run-before-push" }
ops-text-fixers = { path = "extensions/text-fixers" }
ops-config-checkers = { path = "extensions/config-checkers" }
ops-test-coverage = { path = "extensions-rust/test-coverage" }
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "sync", "io-util", "time"] }
libc = "0.2"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tokei = "14.0"
toml = "1"
toml_edit = "0.25"
duckdb = { version = "1.10502" }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inquire = "0.9"
indicatif = "0.18"
assert_cmd = "2"
predicates = "3"
serial_test = "3"
proptest = "1"
shlex = "1"
unicode-width = "0.2"
wait-timeout = "0.2"
comfy-table = "7"
terminal_size = "0.4"
shellexpand = { version = "3.1.2", default-features = false, features = ["base-0"] }
saphyr = "0.0.6"
json5 = "0.4"
ignore = "0.4"
syn = { version = "2", features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# Centralized lint policy (ARCH-11). Every workspace member opts in with
# `[lints] workspace = true`; no crate may set its own lint levels in Cargo.toml.
[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# NOT `rust_2018_idioms`: it implies `unused_extern_crates`, which flags the
# deliberate `extern crate` lines in crates/cli/src/main.rs that keep
# linkme-only extension crates from being dropped by the linker.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Panics and silent wrap-around are banned in production code. Test code opts
# out through the `allow-*-in-tests` keys in clippy.toml (unwrap, expect, panic,
# indexing) and through the crate-root `#![cfg_attr(test, allow(..))]` blocks.
unwrap_used = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
panic = "deny"
exit = "deny"

# Style preferences this codebase deliberately does not share: local `const`,
# `type` and helper declarations are written at their point of use, and clap
# flag structs are legitimately bool-heavy.
items_after_statements = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"

# --- Temporary allows -------------------------------------------------------
# Enabling `nursery` and the panic/arithmetic lints above surfaced 948 pre-existing
# sites. Each lint below is allowed workspace-wide only until its backlog task
# lands, and that task's last step is to delete its line here. Do not add to
# this list: a new exception belongs at the call site with a reason, next to
# the code it excuses (docs/clippy.md).
redundant_pub_crate                 = "allow" # TASK-1676 — 195 sites, 60 files
arithmetic_side_effects             = "allow" # TASK-1671 — 166 sites, 54 files
missing_const_for_fn                = "allow" # TASK-1677 — 92 sites, 44 files
use_self                            = "allow" # TASK-1678 — 87 sites, 22 files
indexing_slicing                    = "allow" # TASK-1672 — 69 sites, 25 files
string_slice                        = "allow" # TASK-1673 — 66 sites, 24 files
as_conversions                      = "allow" # TASK-1674 — 61 sites, 29 files
expect_used                         = "allow" # TASK-1675 — 22 sites, 14 files
needless_collect                    = "allow" # TASK-1682 — 14 sites, 10 files
collection_is_never_read            = "allow" # TASK-1682 — 8 sites, 4 files
equatable_if_let                    = "allow" # TASK-1682 — 6 sites, 2 files
literal_string_with_formatting_args = "allow" # TASK-1682 — 4 sites, 3 files
needless_pass_by_ref_mut            = "allow" # TASK-1682 — 4 sites, 2 files
unreachable                         = "allow" # TASK-1682 — 3 sites, 3 files
future_not_send                     = "allow" # TASK-1682 — 2 sites, 2 files
redundant_clone                     = "allow" # TASK-1682 — 2 sites, 2 files
panic_in_result_fn                  = "allow" # TASK-1682 — 2 sites, 1 file
single_option_map                   = "allow" # TASK-1682 — 1 site, 1 file
derive_partial_eq_without_eq        = "allow" # TASK-1682 — 1 site, 1 file
branches_sharing_code               = "allow" # TASK-1682 — 1 site, 1 file
or_fun_call                         = "allow" # TASK-1682 — 1 site, 1 file
iter_on_single_items                = "allow" # TASK-1682 — 1 site, 1 file

[patch.crates-io]
# RUSTSEC-2026-0037: patch quinn-proto to 0.11.14 (DoS fix)
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "quinn-proto-0.11.14" }

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
