[package]
name = "ops-about"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:ops-sqlite", "ops-extension/sqlite"]
# Shared `assert_debug_escapes_control_chars` helper for the
# Debug-escaping regression tests in the about extensions. Enabled only by
# dev-dependencies; production code never sees it.
test-support = ["ops-core/test-support"]

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
ops-git = { workspace = true }
ops-sqlite = { workspace = true, optional = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
