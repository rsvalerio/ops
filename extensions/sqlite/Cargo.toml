[package]
name = "ops-sqlite"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true, features = ["sqlite"] }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# The ingest staging directory's owner check (`geteuid`) and the
# descriptor-anchored `*at` syscalls `IngestDir` stages through.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
# Exposes test-only helpers for use in dev-dependencies of downstream crates.
# Not part of the stable API.
test-helpers = []

[dev-dependencies]
ops-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
