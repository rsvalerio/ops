[package]
name = "ops-sqlite"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true, features = ["sqlite"] }
linkme = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# SEC / TASK-2039: `geteuid`, to decide whether a sticky shared-writable ingest
# staging parent is owned by a principal we trust. std exposes no equivalent.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
# Exposes test-only helpers for use in dev-dependencies of downstream crates.
# Not part of the stable API.
test-helpers = []

[dev-dependencies]
ops-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
