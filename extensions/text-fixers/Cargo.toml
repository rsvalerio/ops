[package]
name = "ops-text-fixers"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, which machete cannot see through.
ignored = ["linkme"]

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
linkme = { workspace = true }
anyhow = { workspace = true }
ignore = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# test-support surfaces ops_core::test_utils (surfaced skips, classified git
# fixtures) to this crate's tests — TEST-26 / TASK-2126, TASK-2166.
ops-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
