[package]
name = "ops-git"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, which machete cannot see through.
ignored = ["linkme"]

[dependencies]
ops-core = { workspace = true }
ops-extension = { workspace = true }
ops-hook-common = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ops-extension = { workspace = true, features = ["test-support"] }
# The tracing-capture harness this crate's config tests use lives in
# `ops_core::test_utils` behind `test-support`.
ops-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
