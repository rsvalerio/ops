[package]
name = "ops-run-before-push"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# `ops_extension::impl_extension!` expands to `#[linkme::distributed_slice]`
# in this crate, and `ops_hook_common::impl_hook_wrappers!` expands to
# `anyhow` paths; machete cannot see through either macro.
ignored = ["anyhow", "linkme"]

[dependencies]
ops-extension = { workspace = true }
ops-hook-common = { workspace = true }
linkme = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
ops-hook-common = { workspace = true, features = ["test-helpers"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
