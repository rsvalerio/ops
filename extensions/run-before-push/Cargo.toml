[package]
name = "ops-run-before-push"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# `ops_hook_common::impl_hook_wrappers!` expands to `anyhow` paths in this
# crate, which machete cannot see through.
ignored = ["anyhow"]

[dependencies]
ops-extension = { workspace = true }
ops-hook-common = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
ops-core = { workspace = true }
ops-hook-common = { workspace = true, features = ["test-helpers"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
