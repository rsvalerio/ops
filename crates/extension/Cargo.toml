[package]
name = "ops-extension"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
sqlite = []
test-support = ["ops-core/test-support"]

[dependencies]
ops-core = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
bitflags = { workspace = true }
linkme = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ops-core = { workspace = true, features = ["test-support"] }
# The integration tests drive dispatch budgets through `ManualClock`, which
# only exists under this crate's own `test-support` feature.
ops-extension = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
