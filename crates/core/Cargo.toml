[package]
name = "ops-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# DUP-3 / TASK-2014: the shared tracing-capture harness in `test_utils` is
# exported to downstream test code, so `tracing-subscriber` has to be a real
# (optional) dependency here rather than a dev-dependency only.
test-support = ["dep:tracing-subscriber"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
strum = { workspace = true }
comfy-table = { workspace = true }
unicode-width = { workspace = true }
terminal_size = { workspace = true }
shellexpand = { workspace = true }
wait-timeout = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
