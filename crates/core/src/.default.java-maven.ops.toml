# Default commands for Java stack (Maven).

[commands.compile]
program = "./mvnw"
args = ["compile"]
help = "Compile sources"
category = "Build"

[commands.build]
program = "./mvnw"
args = ["package", "-DskipTests"]
help = "Build the project"
category = "Build"

[commands.test]
program = "./mvnw"
args = ["test"]
help = "Run all tests"
category = "Code Quality"

[commands.clean]
program = "./mvnw"
args = ["clean"]
help = "Clean build artifacts"
category = "Build"

# Baseline suggestion — uncomment and adjust to opt in (requires spotless plugin).
# [commands.fmt]
# program = "./mvnw"
# args = ["spotless:apply"]
# help = "Format all code (requires spotless plugin)"
# category = "Code Quality"

# Baseline suggestion — uncomment and adjust to opt in (requires spotless or checkstyle plugin).
# [commands.lint]
# program = "./mvnw"
# args = ["spotless:check"]
# help = "Lint sources (requires spotless or checkstyle plugin)"
# category = "Code Quality"

# `verify` only checks: a formatter or text fixer that would change a file
# fails the gate instead of rewriting it, so the same command is safe in CI
# and on a dev machine. `verify-fix` is the rewriting form.
[commands.verify]
commands = ["compile", "trailing-whitespace-check", "end-of-file-fixer-check", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run compile, trailing-whitespace-check, end-of-file-fixer-check, check-json, check-yaml; fixes nothing in place"
category = "Code Quality"

# `verify` with the rewriters: formats and fixes files in place, then runs
# the same gates.
[commands.verify-fix]
commands = ["compile", "trailing-whitespace", "end-of-file-fixer", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run compile, trailing-whitespace, end-of-file-fixer, check-json, check-yaml; rewrites files in place"
category = "Code Quality"

[commands.qa]
commands = ["test"]
parallel = false
fail_fast = true
help = "Run test"
category = "Code Quality"
