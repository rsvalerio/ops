# Default commands for Node.js stack (npm).

[commands.install]
program = "npm"
args = ["install"]
help = "Install dependencies"
category = "Build"

[commands.build]
program = "npm"
args = ["run", "build"]
help = "Build the project"
category = "Build"

[commands.test]
program = "npm"
args = ["test"]
help = "Run tests"
category = "Code Quality"

[commands.lint]
program = "npm"
args = ["run", "lint"]
help = "Lint the codebase"
category = "Code Quality"

# Baseline suggestion — uncomment and adjust to opt in.
# [commands.fmt]
# program = "npx"
# args = ["prettier", "--write", "."]
# help = "Format all code"
# category = "Code Quality"

[commands.clean]
program = "rm"
args = ["-rf", "node_modules", "dist"]
help = "Remove build artifacts and deps"
category = "Build"

# `verify` only checks: a formatter or text fixer that would change a file
# fails the gate instead of rewriting it, so the same command is safe in CI
# and on a dev machine. `verify-fix` is the rewriting form.
[commands.verify]
commands = ["install", "lint", "build", "trailing-whitespace-check", "end-of-file-fixer-check", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run install, lint, build, trailing-whitespace-check, end-of-file-fixer-check, check-json, check-yaml; fixes nothing in place"
category = "Code Quality"

# `verify` with the rewriters: formats and fixes files in place, then runs
# the same gates.
[commands.verify-fix]
commands = ["install", "lint", "build", "trailing-whitespace", "end-of-file-fixer", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run install, lint, build, trailing-whitespace, end-of-file-fixer, check-json, check-yaml; rewrites files in place"
category = "Code Quality"

[commands.qa]
commands = ["test"]
parallel = false
fail_fast = true
help = "Run test"
category = "Code Quality"
