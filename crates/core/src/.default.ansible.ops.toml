# Default commands for Ansible stack.

[commands.lint]
program = "ansible-lint"
args = []
help = "Lint playbooks"
category = "Code Quality"

[commands.check]
program = "ansible-playbook"
args = ["--check", "site.yml"]
help = "Dry-run playbook"
category = "Code Quality"

# Baseline suggestion — uncomment and adjust to opt in (requires ansible-lint --fix).
# [commands.fmt]
# program = "ansible-lint"
# args = ["--fix"]
# help = "Auto-fix lint findings"
# category = "Code Quality"

