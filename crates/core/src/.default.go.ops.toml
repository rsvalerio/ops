# Default commands for Go stack.

[commands.fmt]
program = "go"
args = ["fmt", "./..."]
help = "Format all code"
category = "Code Quality"

# The non-mutating twin of `fmt`. `gofmt -l` lists the files it would
# reformat but exits 0, so the shell turns a non-empty list into a failure.
# The files come from `go list`, the same set `go fmt ./...` formats (so
# vendor/, testdata/ and nested modules are out), and a gofmt error such as a
# syntax error fails the check too.
[commands.fmt-check]
program = "sh"
args = ["-c", "files=$(go list -e -f '{{$d := .Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{\"\\n\"}}{{end}}{{range .CgoFiles}}{{$d}}/{{.}}{{\"\\n\"}}{{end}}{{range .TestGoFiles}}{{$d}}/{{.}}{{\"\\n\"}}{{end}}{{range .XTestGoFiles}}{{$d}}/{{.}}{{\"\\n\"}}{{end}}{{range .IgnoredGoFiles}}{{$d}}/{{.}}{{\"\\n\"}}{{end}}' ./...) || exit 1; [ -n \"$files\" ] || exit 0; out=$(printf '%s\\n' \"$files\" | tr '\\n' '\\0' | xargs -0 gofmt -l) || exit 1; [ -z \"$out\" ] || { printf 'gofmt would reformat:\\n%s\\n' \"$out\" >&2; exit 1; }"]
help = "Fail on unformatted code without rewriting it"
category = "Code Quality"

[commands.vet]
program = "go"
args = ["vet", "./..."]
aliases = ["lint"]
help = "Vet all packages"
category = "Code Quality"

[commands.build]
program = "go"
args = ["build", "./..."]
help = "Build all packages"
category = "Build"

[commands.test]
program = "go"
args = ["test", "./..."]
help = "Run all tests"
category = "Code Quality"

[commands.clean]
program = "go"
args = ["clean", "./..."]
help = "Remove build artifacts"
category = "Build"

# `verify` only checks: a formatter or text fixer that would change a file
# fails the gate instead of rewriting it, so the same command is safe in CI
# and on a dev machine. `verify-fix` is the rewriting form.
[commands.verify]
commands = ["fmt-check", "build", "trailing-whitespace-check", "end-of-file-fixer-check", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run fmt-check, build, trailing-whitespace-check, end-of-file-fixer-check, check-json, check-yaml; fixes nothing in place"
category = "Code Quality"

# `verify` with the rewriters: formats and fixes files in place, then runs
# the same gates.
[commands.verify-fix]
commands = ["fmt", "build", "trailing-whitespace", "end-of-file-fixer", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run fmt, build, trailing-whitespace, end-of-file-fixer, check-json, check-yaml; rewrites files in place"
category = "Code Quality"

[commands.qa]
commands = ["test", "vet"]
parallel = false
fail_fast = true
help = "Run test, vet"
category = "Code Quality"
