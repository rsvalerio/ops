# Default commands for Terraform stack.

# Not `init`: `ops init` is the builtin that scaffolds `.ops.toml`, and clap
# matches builtins before config commands, so a default named `init` could
# never run as `ops init` (TASK-2297).
[commands.tf-init]
program = "terraform"
args = ["init"]
help = "Initialize Terraform"
category = "Build"

[commands.fmt]
program = "terraform"
args = ["fmt", "-recursive"]
help = "Format all files"
category = "Code Quality"

# The non-mutating twin of `fmt`: fails on unformatted files, writes nothing.
[commands.fmt-check]
program = "terraform"
args = ["fmt", "-check", "-recursive"]
help = "Fail on unformatted files without rewriting them"
category = "Code Quality"

[commands.validate]
program = "terraform"
args = ["validate"]
help = "Validate configuration"
category = "Code Quality"

[commands.plan]
program = "terraform"
args = ["plan"]
help = "Show execution plan"
category = "Code Quality"

