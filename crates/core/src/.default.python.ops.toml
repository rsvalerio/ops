# Default commands for Python stack (uv).

[commands.sync]
program = "uv"
args = ["sync", "--extra", "dev"]
help = "Install and sync dependencies"
category = "Build"

[commands.ruff-fix]
program = "uv"
args = ["run", "ruff", "check", "--fix", "."]
help = "Auto-fix lint issues with ruff"
category = "Code Quality"

[commands.black-fmt]
program = "uv"
args = ["run", "black", "."]
help = "Format with black"
category = "Code Quality"

[commands.fmt]
commands = ["ruff-fix", "black-fmt"]
parallel = false
fail_fast = true
help = "Run ruff --fix then black"
category = "Code Quality"

[commands.ruff]
program = "uv"
args = ["run", "ruff", "check", "."]
help = "Lint with ruff"
category = "Code Quality"

[commands.black]
program = "uv"
args = ["run", "black", "--check", "."]
help = "Check formatting with black"
category = "Code Quality"

[commands.lint]
commands = ["ruff", "black"]
# TASK-1656: sequential. Nested in the sequential `verify`, a `parallel = true`
# here would run sequentially anyway (the root schedules the whole plan), so the
# flag would only claim a concurrency the plan never gets.
parallel = false
fail_fast = true
help = "Run ruff check and black --check"
category = "Code Quality"

[commands.type]
program = "uv"
args = ["run", "pyright"]
help = "Type-check with pyright"
category = "Code Quality"

[commands.test]
program = "uv"
args = ["run", "pytest", "-q"]
help = "Run tests with pytest"
category = "Code Quality"

[commands.clean]
program = "rm"
args = ["-rf", ".pytest_cache", ".ruff_cache", ".pyright", "build", "dist"]
help = "Remove caches and build artifacts"
category = "Build"

# Baseline suggestion — uncomment and adjust to opt in.
# [commands.build]
# program = "uv"
# args = ["build"]
# help = "Build sdist and wheel"
# category = "Build"

# `verify` only checks: a formatter or text fixer that would change a file
# fails the gate instead of rewriting it, so the same command is safe in CI
# and on a dev machine. `verify-fix` is the rewriting form. There is no
# `fmt` step: `lint` already runs its check form (ruff check, black --check).
[commands.verify]
commands = ["lint", "type", "trailing-whitespace-check", "end-of-file-fixer-check", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run lint, type, trailing-whitespace-check, end-of-file-fixer-check, check-json, check-yaml; fixes nothing in place"
category = "Code Quality"

# `verify` with the rewriters: formats and fixes files in place, then runs
# the same gates.
[commands.verify-fix]
commands = ["fmt", "lint", "type", "trailing-whitespace", "end-of-file-fixer", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run fmt, lint, type, trailing-whitespace, end-of-file-fixer, check-json, check-yaml; rewrites files in place"
category = "Code Quality"

[commands.qa]
commands = ["test"]
parallel = false
fail_fast = true
help = "Run test"
category = "Code Quality"
