# Default commands for Rust stack (Cargo).

[commands.fmt]
program = "cargo"
args = ["fmt", "--all"]
exclusive = true
help = "Format all code"
category = "Code Quality"

[commands.check]
program = "cargo"
args = ["check", "--workspace", "--all-features", "--all-targets"]
help = "Check all targets"
category = "Code Quality"

[commands.clippy]
program = "cargo"
args = ["clippy", "--workspace", "--all-features", "--all-targets", "--", "-D", "warnings"]
aliases = ["lint"]
help = "Lint with clippy"
category = "Code Quality"

[commands.doc]
program = "cargo"
args = ["doc", "--workspace", "--no-deps", "--document-private-items", "--all-features"]
help = "Build docs; denied workspace lint fails on broken intra-doc links"
category = "Code Quality"

[commands.build]
program = "cargo"
args = ["build", "--workspace", "--all-features", "--all-targets"]
help = "Build all targets"
category = "Build"

# No --all-targets here: for `cargo test` it *disables doctests*
# ("Test all targets (does not include doctests)" — cargo test --help).
[commands.test]
program = "cargo"
args = ["test", "--workspace", "--all-features"]
help = "Run all tests (ignoring ignored tests)"
category = "Code Quality"

[commands.test-doc]
program = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]
help = "Run doctests (nextest does not run them)"
category = "Code Quality"

[commands.test-ignored]
program = "cargo"
args = ["test", "--workspace", "--all-features", "--", "--ignored"]
help = "Run all tests (including ignored tests)"
category = "Code Quality"

[commands.next]
program = "cargo"
args = ["nextest", "run", "--workspace", "--all-features"]
help = "Run unit and integration tests with nextest"
category = "Code Quality"

[commands.next-ignored]
program = "cargo"
args = ["nextest", "run", "--workspace", "--all-features", "--run-ignored", "ignored-only"]
help = "Run ignored tests with nextest"
category = "Code Quality"

[commands.clean]
program = "cargo"
args = ["clean"]
help = "Remove build artifacts"
category = "Build"

# Staged: the steps that rewrite files run alone and in order, then the
# readers run together:
#
#   fmt → trailing-whitespace → end-of-file-fixer
#       → (clippy | build | check-json | check-yaml | doc)
#
# `fmt` is exclusive above; the two text fixers are exclusive in their own
# definitions (`ExecCommandSpec::ops_subcommand`). trailing-whitespace must
# precede end-of-file-fixer: the EOF fixer strips only newlines, so running it
# first leaves a double newline where a whitespace-only last line was.
#
# `check` is deliberately absent — `build --all-targets` subsumes it and clippy
# type-checks independently, so including it compiled the workspace a third
# time under a third fingerprint. It remains available as a standalone command.
[commands.verify]
commands = ["fmt", "trailing-whitespace", "end-of-file-fixer", "clippy", "build", "check-json", "check-yaml", "doc"]
parallel = true
fail_fast = true
help = "Run fmt, trailing-whitespace, end-of-file-fixer, then clippy, build, check-json, check-yaml, doc in parallel"
category = "Code Quality"

[commands.qa]
commands = ["deps", "test", "test-doc", "sec"]
parallel = false
fail_fast = true
help = "Run deps, test, test-doc, sec"
category = "Code Quality"

[commands.qa-next]
aliases = ["qax"]
commands = ["deps", "next", "test-doc",  "sec"]
parallel = false
fail_fast = true
help = "Run deps, next, test-doc, sec"
category = "Code Quality"
