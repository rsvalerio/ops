# Default commands for the Vite + TypeScript stack (bun).
#
# Detected by a `vite.config.{ts,js,mjs,mts,cjs,cts}` manifest, which is checked
# before the generic Node stack so Vite projects get type-checking + Vite-aware
# defaults instead of the bare `npm run build` delegation.
#
# Commands invoke the toolchain directly through `bunx` so they work even when a
# project has not wired up matching `package.json` scripts. Override `program`
# in `.ops.toml` to switch the runner (e.g. `npx`, `pnpm dlx`, `yarn dlx`).

[commands.install]
program = "bun"
args = ["install"]
help = "Install dependencies"
category = "Build"

[commands.typecheck]
program = "bunx"
args = ["tsc", "-b", "--noEmit"]
help = "Type-check without emitting"
category = "Code Quality"

[commands.build]
program = "bunx"
args = ["vite", "build"]
help = "Build the project"
category = "Build"

[commands.lint]
program = "bunx"
args = ["eslint", "."]
help = "Lint the codebase"
category = "Code Quality"

[commands.test]
program = "bunx"
args = ["vitest", "run"]
help = "Run tests once (non-watch)"
category = "Code Quality"

