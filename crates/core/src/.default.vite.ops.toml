[commands.verify]
commands = ["install", "typecheck", "lint", "build"]
parallel = false
fail_fast = true
help = "Run install, typecheck, lint, build"
category = "Code Quality"

[commands.qa]
commands = ["test"]
parallel = false
fail_fast = true
help = "Run test"
category = "Code Quality"
