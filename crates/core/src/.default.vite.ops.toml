[commands.clean]
program = "rm"
args = ["-rf", "node_modules", "dist"]
help = "Remove build artifacts and deps"
category = "Build"

# `verify` only checks: a formatter or text fixer that would change a file
# fails the gate instead of rewriting it, so the same command is safe in CI
# and on a dev machine. `verify-fix` is the rewriting form.
[commands.verify]
commands = ["install", "typecheck", "lint", "build", "trailing-whitespace-check", "end-of-file-fixer-check", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run install, typecheck, lint, build, trailing-whitespace-check, end-of-file-fixer-check, check-json, check-yaml; fixes nothing in place"
category = "Code Quality"

# `verify` with the rewriters: formats and fixes files in place, then runs
# the same gates.
[commands.verify-fix]
commands = ["install", "typecheck", "lint", "build", "trailing-whitespace", "end-of-file-fixer", "check-json", "check-yaml"]
parallel = false
fail_fast = true
help = "Run install, typecheck, lint, build, trailing-whitespace, end-of-file-fixer, check-json, check-yaml; rewrites files in place"
category = "Code Quality"

[commands.qa]
commands = ["test"]
parallel = false
fail_fast = true
help = "Run test"
category = "Code Quality"
